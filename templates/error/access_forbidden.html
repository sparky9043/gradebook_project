{% extends 'base.html' %}
{% block main %}
  <main class="flex-grow flex items-center justify-center px-gutter">
    <div class="max-w-[480px] w-full text-center py-xl">
      <div class="mb-lg flex justify-center">
        <span class="material-symbols-outlined text-[64px] text-outline opacity-40">lock</span>
      </div>
      <h1 class="font-h1 text-h1 text-on-surface mb-md">403 - Access Forbidden</h1>
      <p class="font-body-lg text-body-lg text-on-surface-variant mb-xl">
        You do not have permission to access this resource. Please contact your administrator if you believe this is an
        error.
      </p>
      <div class="flex flex-col items-center">
        <a class="inline-flex items-center justify-center bg-primary text-on-primary px-lg py-md font-label-sm rounded-lg transition-all duration-200 hover:bg-surface-tint active:opacity-80"
           href="#">Return to Dashboard</a>
      </div>
    </div>
  </main>
{% endblock main %}
