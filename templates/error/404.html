{% extends 'base.html' %}
{% block main %}
  <main class="flex-grow flex items-center justify-center">
    <div class="w-full px-gutter py-xl text-center">
      <div class="mb-lg">
        <span class="material-symbols-outlined text-[80px] text-outline-variant"
              style="font-variation-settings: 'FILL' 0">search_off</span>
      </div>
      <h1 class="font-h1 text-h1 text-on-surface mb-sm">404 - Page Not Found</h1>
      <p class="font-body-lg text-body-lg text-on-surface-variant mb-xl">
        The resource you are looking for does not exist or has been moved.
      </p>
      <div class="flex flex-col md:flex-row justify-center gap-md">
        <a class="inline-flex items-center justify-center bg-primary text-on-primary px-lg py-md rounded font-label-sm text-label-sm uppercase tracking-wider transition-all duration-200 hover:opacity-90 active:scale-95"
           href="#">Return to Dashboard</a>
        <a class="inline-flex items-center justify-center border border-primary text-primary px-lg py-md rounded font-label-sm text-label-sm uppercase tracking-wider transition-all duration-200 hover:bg-surface-container-low active:scale-95"
           href="#">Contact Support</a>
      </div>
    </div>
  </div>
</main>
{% endblock main %}
