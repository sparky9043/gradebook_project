<div
  id="message-container"
  class="fixed top-24 right-8 z-50 pointer-events-none" 
>
  {% for message in messages %}
  <div
    class="pointer-events-auto bg-surface-container-lowest border border-outline-variant px-md py-sm rounded-lg shadow-sm flex items-center gap-sm min-w-[240px]">
    <div class="w-8 h-8 rounded-full bg-green-50 flex items-center justify-center">
      {% if message.tags == 'success' %}
      <span
        class="material-symbols-outlined text-green-600 text-sm"
        style="font-variation-settings: 'FILL' 1;">check_circle</span>
      {% elif message.tags == 'error' %}
      <span
        class="material-symbols-outlined text-red-600 text-sm"
        style="font-variation-settings: 'FILL' 1;">dangerous</span>
      {% endif %}
    </div>
    <div class="flex flex-col">
      <span class="font-label-sm text-label-sm text-on-surface">{{ message }}</span>
    </div>
  </div>
  {% endfor %}
</div>
