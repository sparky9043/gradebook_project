<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.pydata.org/bokeh/release/bokeh-3.9.0.min.css" rel="stylesheet" type="text/css">
  <link href="https://cdn.pydata.org/bokeh/release/bokeh-widgets-3.9.0.min.css" rel="stylesheet" type="text/css">
  <link
    href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono&amp;display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
  <script src="{% static 'js/tailwindcss.js' %}"></script>
  {% include 'style_tag.html' %}
  <title>Document</title>
</head>

<body class="font-body-md antialiased">
  {% if not hide_nav %}
    {% include 'nav.html' %}
  {% endif %}

  {% block main %} {% endblock main %}
  {% include 'message_container.html' %}

  {% if not hide_footer %}
    {% include 'footer.html' %}
  {% endif %}

  <!-- {% if show_sticky %}
  {% include 'sticky.html' %}
  {% endif %} -->
  <script src="{% static 'js/script.js' %}"></script>
  {{ script| safe }}
  <script src="https://cdn.bokeh.org/bokeh/release/bokeh-3.9.0.min.js"></script>
  <script src="https://cdn.bokeh.org/bokeh/release/bokeh-widgets-3.9.0.min.js"></script>
  <script src="https://cdn.bokeh.org/bokeh/release/bokeh-tables-3.9.0.min.js"></script>
  <script src="https://cdn.bokeh.org/bokeh/release/bokeh-api-3.9.0.min.js"></script>
</body>

</html>
