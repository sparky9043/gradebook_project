<!DOCTYPE html>
{% load static %}
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link
    href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&amp;family=JetBrains+Mono&amp;display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
  <link
    href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
    rel="stylesheet" />
  <script src="{% static 'js/tailwindcss.js' %}"></script>
  <style type="text/tailwindcss">
    @theme {
    /* Colors */
    --color-primary-container: #2196f3;
    --color-surface-container-high: #e5e8ee;
    --color-on-error: #ffffff;
    --color-primary-fixed: #d1e4ff;
    --color-error: #ba1a1a;
    --color-surface-variant: #e0e3e8;
    --color-error-container: #ffdad6;
    --color-secondary-fixed-dim: #ffb4a9;
    --color-secondary-fixed: #ffdad5;
    --color-on-surface-variant: #404752;
    --color-inverse-surface: #2d3135;
    --color-inverse-on-surface: #eef1f6;
    --color-tertiary-container: #db7900;
    --color-background: #f7f9ff;
    --color-tertiary-fixed-dim: #ffb77b;
    --color-primary-fixed-dim: #9ecaff;
    --color-on-surface: #181c20;
    --color-on-primary: #ffffff;
    --color-surface-bright: #f7f9ff;
    --color-on-tertiary: #ffffff;
    --color-on-secondary-fixed: #410001;
    --color-outline-variant: #bfc7d4;
    --color-surface-container-low: #f1f4f9;
    --color-on-tertiary-fixed: #2e1500;
    --color-inverse-primary: #9ecaff;
    --color-on-tertiary-fixed-variant: #6d3900;
    --color-secondary-container: #ff7766;
    --color-surface-container-highest: #e0e3e8;
    --color-on-primary-fixed-variant: #00497d;
    --color-on-secondary-fixed-variant: #871f17;
    --color-on-secondary-container: #710e09;
    --color-on-error-container: #93000a;
    --color-surface-container: #ebeef3;
    --color-on-primary-container: #002c4f;
    --color-surface-container-lowest: #ffffff;
    --color-surface: #f7f9ff;
    --color-primary: #0061a4;
    --color-secondary: #a8372b;
    --color-on-background: #181c20;
    --color-tertiary-fixed: #ffdcc2;
    --color-on-tertiary-container: #452200;
    --color-on-secondary: #ffffff;
    --color-surface-tint: #0061a4;
    --color-outline: #707883;
    --color-surface-dim: #d7dadf;
    --color-on-primary-fixed: #001d36;
    --color-tertiary: #904d00;

    /* Border Radius */
    --radius-DEFAULT: 0.125rem;
    --radius-lg: 0.25rem;
    --radius-xl: 0.5rem;
    --radius-full: 0.75rem;

    /* Spacing */
    --spacing-gutter: 24px;
    --spacing-md: 1.5rem;
    --spacing-xl: 4rem;
    --spacing-lg: 2.5rem;
    --spacing-base: 4px;
    --spacing-xs: 0.5rem;
    --spacing-container-max: 960px;
    --spacing-sm: 1rem;

    /* Font Families */
    --font-code: "JetBrains Mono", monospace;
    --font-body-lg: "Work Sans";
    --font-h3: "Work Sans";
    --font-body-md: "Work Sans";
    --font-label-sm: "Work Sans";
    --font-h2: "Work Sans";
    --font-h1: "Work Sans";

    /* Font Sizes */
    --text-code: 0.9rem;
    --text-code--line-height: 1.5;
    --text-code--font-weight: 400;

    --text-body-lg: 1.125rem;
    --text-body-lg--line-height: 1.75;
    --text-body-lg--font-weight: 400;

    --text-h3: 1.5rem;
    --text-h3--line-height: 1.4;
    --text-h3--font-weight: 600;

    --text-body-md: 1rem;
    --text-body-md--line-height: 1.6;
    --text-body-md--font-weight: 400;

    --text-label-sm: 0.875rem;
    --text-label-sm--line-height: 1.4;
    --text-label-sm--letter-spacing: 0.05em;
    --text-label-sm--font-weight: 500;

    --text-h2: 1.875rem;
    --text-h2--line-height: 1.3;
    --text-h2--letter-spacing: -0.01em;
    --text-h2--font-weight: 600;

    --text-h1: 2.5rem;
    --text-h1--line-height: 1.2;
    --text-h1--letter-spacing: -0.02em;
    --text-h1--font-weight: 700;
  }
</style>
  <style>
    body {
      background-color: #ffffff;
      color: #181c20;
    }

    .academic-border {
      border: 1px solid #e0e3e8;
    }

    .active-tab {
      border-left: 4px solid #0061a4;
      padding-left: 0.5rem;
    }
  </style>
  <title>Document</title>
</head>

<body class="font-body-md antialiased">
  {% if not hide_nav %}
    {% include 'nav.html' %}
  {% endif %}

  {% block main %} {% endblock main %}
  {% include 'message_container.html' %}

  {% if not hide_footer %}
    {% include 'footer.html' %}
  {% endif %}

  <!-- {% if show_sticky %}
  {% include 'sticky.html' %}
  {% endif %} -->
  <script src="{% static 'js/addStudentDialog.js' %}"></script>
  <script src="{% static 'js/toastMessage.js' %}"></script>
</body>

</html>
