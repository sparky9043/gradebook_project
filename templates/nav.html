<header class="w-full border-b border-slate-200 dark:border-slate-800 bg-white dark:bg-slate-900 sticky top-0 z-50">
    <div class="max-w-7xl mx-auto flex items-center justify-between px-6 h-16">
        <div class="flex-1 flex justify-start">
            <span class="text-xl font-semibold tracking-tight text-slate-900 dark:text-white">Academia</span>
        </div>
        {% if user.is_authenticated %}
        <nav class="hidden md:flex gap-6 flex-1 justify-center">
            <a class="text-slate-600 dark:text-slate-400 hover:border-b-4 hover:text-blue-600 font-body-md text-body-md duration-200 ease-in-out "
              href="{% url 'gradebook:home' %}"
            >
              <span
                class="material-symbols-outlined">home</span>
            </a>
            <a class="text-slate-600 dark:text-slate-400 hover:border-b-4 hover:text-blue-600 font-body-md text-body-md duration-200 ease-in-out"
                href="{% url 'gradebook:courses' %}">Courses</a>
            <a class="text-slate-600 dark:text-slate-400 hover:border-b-4 hover:text-blue-600 font-body-md text-body-md duration-200 ease-in-out"
                href="{% url 'gradebook:students' %}">Students</a>
            <a class="text-slate-600 dark:text-slate-400 hover:border-b-4 hover:text-blue-600 font-body-md text-body-md duration-200 ease-in-out"
                href="#">Grades</a>
        </nav>
        {% else %}
        <nav class="hidden md:flex gap-6 flex-1 justify-center">
            <a class="text-slate-600 dark:text-slate-400 hover:border-b-4 hover:text-blue-600 font-body-md text-body-md duration-200 ease-in-out"
                href="#">Features</a>
            <a class="text-slate-600 dark:text-slate-400 hover:border-b-4 hover:text-blue-600 font-body-md text-body-md duration-200 ease-in-out"
                href="#">About</a>
        </nav>
        {% endif %}
        <div class="flex-1 flex justify-end">
          {% if user.is_authenticated %}
            <form method="post" action="{% url 'accounts:logout_view' %}">{% csrf_token %}
              <button
                class="bg-primary hover:bg-primary-container text-white px-6 py-2 rounded-DEFAULT font-label-sm text-label-sm transition-colors duration-200 ease-in-out"
                type="submit"
              >
                  Logout
              </button>
            </form>
          {% else %}
            <a
                class="bg-primary hover:bg-primary-container text-white px-6 py-2 rounded-DEFAULT font-label-sm text-label-sm transition-colors duration-200 ease-in-out"
                href="{% url 'accounts:login_view' %}"
            >
                Login
            </a>
          {% endif %}
        </div>
    </div>
</header>
