<h2>{{ student }}</h2>
<h3>Enrolled Courses</h3>
<div>
  <ul>
    {% for record in records %}
    <li>
      <div>
        {{ record.course }}
        {% if record.final_grade %}
          {{ record.final_grade }}
        {% else %}
          <span>N/A</span>
        {% endif %}
      </div>
    </li>
    {% endfor %}
  </ul>
</div>
