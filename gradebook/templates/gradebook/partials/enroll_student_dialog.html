<dialog
  class="p-0 border border-surface-variant bg-white w-full max-w-md shadow-2xl overflow-hidden fixed top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 m-0"
  id="enrollmentDialog" open="open">
  <div class="flex flex-col">
    <div class="flex items-center justify-between px-md py-sm border-b border-surface-variant bg-surface-container-low">
      <h3 class="font-h3 text-body-lg font-semibold text-on-background">Enroll Student in Course</h3>
      <button class="p-xs text-on-surface-variant hover:text-primary transition-colors"
        onclick="enrollmentDialog.close()">
        <span class="material-symbols-outlined" data-icon="close">close</span>
      </button>
    </div>
    <form class="p-md space-y-md" method="dialog">
      <div class="space-y-xs">
        <label class="block font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider"
          for="course-select">Select Course</label>
        <select
          class="w-full bg-white border border-outline-variant focus:border-primary focus:ring-0 px-sm py-xs font-body-md text-body-md transition-colors outline-none"
          id="course-select">
          <option value="">Choose a course...</option>
          <option value="cs405">Cloud Computing Architecture (CS-405)</option>
          <option value="cs410">Machine Learning (CS-410)</option>
          <option value="ph210">History of Logic (PH-210)</option>
          <option value="ma301">Complex Analysis (MA-301)</option>
        </select>
      </div>
      <div class="flex flex-col sm:flex-row-reverse gap-sm pt-sm">
        <button
          class="w-full sm:w-auto bg-primary text-on-primary px-lg py-xs font-label-sm text-label-sm hover:opacity-90 transition-all"
          type="submit">Enroll Student</button>
        <button
          class="w-full sm:w-auto border border-outline-variant px-lg py-xs font-label-sm text-label-sm text-on-surface-variant hover:bg-surface-container-low transition-all"
          onclick="enrollmentDialog.close()" type="button">Cancel</button>
      </div>
    </form>
  </div>
</dialog>
