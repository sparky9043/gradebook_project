<dialog
  id="enrollment-dialog"
  class="fixed inset-0 m-auto w-full max-w-[400px] p-0 bg-surface-container-lowest border border-surface-variant shadow-none outline-none"
>
  <div class="flex flex-col">
    <div class="flex items-center justify-between px-md py-sm border-b border-surface-variant bg-surface-container-low">
      <h3 class="font-h3 text-body-lg font-semibold text-on-background">Enroll Student in Course</h3>
      <button
        class="p-xs text-on-surface-variant hover:text-primary transition-colors"
        id="close-enroll-student-modal-btn"
      >
        <span class="material-symbols-outlined" data-icon="close">close</span>
      </button>
    </div>
    <form class="p-md space-y-md" method="post" action="{% url 'gradebook:enroll' student.pk %}">{% csrf_token %}
      <div class="space-y-xs">
        <label class="block font-label-sm text-label-sm text-on-surface-variant uppercase tracking-wider"
          for="course">Select Course</label>
        <select
          class="w-full bg-white border border-outline-variant focus:border-primary focus:ring-0 px-sm py-xs font-body-md text-body-md transition-colors outline-none"
          name="course"
          id="course">
          {% for course_title in courses %}
          <option value="{{ course_title }}">{{ course_title }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="flex flex-col sm:flex-row-reverse gap-sm pt-sm">
        <button
          class="w-full sm:w-auto bg-primary text-on-primary px-lg py-xs font-label-sm text-label-sm hover:opacity-90 transition-all"
          type="submit">Enroll Student</button>
        <button
          id="cancel-enroll-student-modal-btn"
          class="w-full sm:w-auto border border-outline-variant px-lg py-xs font-label-sm text-label-sm text-on-surface-variant hover:bg-surface-container-low transition-all"
          type="button"
        >Cancel</button>
      </div>
    </form>
  </div>
</dialog>
