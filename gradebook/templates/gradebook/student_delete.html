{% extends 'base.html' %}
{% block main %}
  <form method="post">
    {% csrf_token %}
    <h1>Delete {{ object }}?</h1>
    <p>Are you sure you want to delete this student? This cannot be undone</p>
    <button type="submit">Delete</button>
    <a href="{% url 'gradebook:student_detail' student.pk %}">Cancel</a>
  </form>
{% endblock main %}
