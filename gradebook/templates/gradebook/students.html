{% extends 'base.html' %}

{% block main %}
{% include 'gradebook/partials/add_student_dialog.html' %}
<main class="max-w-7xl mx-auto px-6 py-xl">
  <div class="mb-lg">
    <h1 class="font-h1 text-h1 text-on-background mb-base">Student Roster</h1>
    <p class="font-body-lg text-body-lg text-on-surface-variant">Click on Student Name for Details</p>
    <p class="font-body-lg text-body-lg text-on-surface-variant text-sm">
      Total Students: {{ students.count }}
    </p>
    <button
      id="show-student-dialog-btn"
      class="flex items-center bg-primary hover:bg-primary-container text-white px-6 py-2 rounded-DEFAULT font-label-sm text-label-sm transition-colors duration-200 ease-in-out"
    >
      <span class="material-symbols-outlined">
      person_add
      </span>
        Add Student
    </button>
  </div>
  <!-- Student Data Table -->
  <div class="bg-white border border-outline-variant overflow-hidden">
    {% include 'gradebook/partials/students_table.html' %}
  </div>
</main>
{% endblock main %}
